packages:
  - apps/*
  - packages/*

# Exact versions keep every workspace on the same, reproducible dependency set.
saveExact: true

# One place for every shared dependency version. Workspaces reference these with `catalog:`.
catalog:
  # Tooling
  '@types/node': 24.19.1
  oxlint: 1.86.0
  oxlint-tsgolint: 7.0.2003
  prettier: 3.9.9
  turbo: 2.11.7
  typescript: 6.0.3
  vitest: 5.0.3
  '@vitest/coverage-v8': 5.0.3
  jsdom: 30.1.1
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.7
  '@testing-library/jest-dom': 7.0.1

  # Runtime libraries
  zod: 4.6.5
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0

  # Front-end build and styling
  vite: 8.3.2
  '@vitejs/plugin-react': 6.1.1
  tailwindcss: 4.3.3
  '@tailwindcss/vite': 4.3.3
  shadcn: 4.21.1
  lucide-react: 1.51.0
  '@base-ui/react': 1.8.0
  class-variance-authority: 0.7.1
  cn: 0.4.0
  tw-animate-css: 1.4.0

  # NestJS server (web-server-demo)
  '@nestjs/common': 12.1.2
  '@nestjs/core': 12.1.2
  '@nestjs/platform-express': 12.1.2
  '@nestjs/testing': 12.1.2
  '@nestjs/cli': 12.0.8
  '@nestjs/graphql': 14.0.3
  '@nestjs/apollo': 14.0.3
  '@apollo/server': 5.5.1
  '@as-integrations/express5': 1.1.2
  express: 5.2.1
  '@types/express': 5.0.6
  graphql: 16.14.2
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  supertest: 7.3.1
  '@types/supertest': 7.2.1

  # Web demo (React SPA)
  '@tanstack/react-router': 1.170.41
  '@tanstack/router-plugin': 1.168.42
  '@tanstack/react-router-devtools': 1.167.2
  '@tanstack/react-query': 5.104.1
  '@tanstack/react-query-devtools': 5.104.1
  '@graphql-codegen/cli': 7.4.3
  '@graphql-codegen/client-preset': 6.2.0
  '@graphql-typed-document-node/core': 3.2.0

# Packages released too recently for pnpm's default release-age safety delay, allowed explicitly.
minimumReleaseAgeExclude:
  - lucide-react@1.51.0

allowBuilds:
  '@apollo/protobufjs': false
