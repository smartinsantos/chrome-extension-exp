packages:
  - apps/*
  - packages/*

# Exact versions keep every workspace on the same, reproducible dependency set.
saveExact: true

# One place for every shared dependency version. Workspaces reference these with `catalog:`.
catalog:
  # Tooling
  '@types/node': 24.19.1
  oxlint: 1.86.0
  oxlint-tsgolint: 7.0.2003
  prettier: 3.9.9
  turbo: 2.11.7
  typescript: 6.0.3
  vitest: 5.0.3
  '@vitest/coverage-v8': 5.0.3
  jsdom: 30.1.1
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.7
  '@testing-library/jest-dom': 7.0.1

  # Runtime libraries
  zod: 4.6.5
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0

  # Front-end build and styling
  vite: 8.3.2
  '@vitejs/plugin-react': 6.1.1
  tailwindcss: 4.3.3
  '@tailwindcss/vite': 4.3.3
  shadcn: 4.21.1
  lucide-react: 1.51.0
  '@base-ui/react': 1.8.0
  class-variance-authority: 0.7.1
  cn: 0.4.0
  tw-animate-css: 1.4.0

minimumReleaseAgeExclude:
  - lucide-react@1.51.0
